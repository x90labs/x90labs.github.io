const TOOL_RESULT = "trn-result";
const TOOL_SAVE = "trn-save";
const TOOL_STORAGE = "trn-storage";

  const shareButton = document.querySelector('#share-link');
  const saveButton = document.querySelector('#save-tool');
  const clearButton = document.querySelector('#clear-tool');
  const note = document.querySelector('#share-note');
  const result = document.querySelector('#tool-result');
  let timer = 0;

  function syncClear() {
    const saved = localStorage.getItem(`trn:${location.pathname}`);
    if (!clearButton) return;
    clearButton.style.display = saved ? '' : 'none';
  }

  async function copyUrl() {
    const url = `${location.origin}${location.pathname}${location.search}`;
    try {
      await navigator.clipboard.writeText(url);
    } catch {
      const area = document.createElement('textarea');
      area.value = url;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.left = '-9999px';
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    }
    note?.classList.remove('hidden');
    window.clearTimeout(timer);
    timer = window.setTimeout(() => note?.classList.add('hidden'), 1600);
  }

  shareButton?.addEventListener('click', () => {
    void copyUrl();
  });
  saveButton?.addEventListener('click', () => {
    window.dispatchEvent(new CustomEvent(TOOL_SAVE));
  });
  clearButton?.addEventListener('click', () => {
    window.dispatchEvent(new CustomEvent(TOOL_CLEAR));
  });
  window.addEventListener(TOOL_STORAGE, syncClear);
  window.addEventListener(TOOL_RESULT, (event) => {
    const text = event instanceof CustomEvent && typeof event.detail === 'string' ? event.detail : '';
    if (!result) return;
    result.textContent = text;
    result.classList.toggle('hidden', text === '');
  });
  syncClear();
})();</script>
