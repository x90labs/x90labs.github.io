const TOOL_SAVE = "trn-save";
const VISIT_KEY = "trn:visits";

  const shareButton = document.querySelector('#share-link');
  const autoSave = document.querySelector('#auto-save');
  const note = document.querySelector('#share-note');
  let timer = 0;

  try {
    const raw = localStorage.getItem(VISIT_KEY);
    const counts = raw ? JSON.parse(raw) : {};
    if (counts && typeof counts === 'object' && !Array.isArray(counts)) {
      const current = counts[location.pathname];
      counts[location.pathname] = (typeof current === 'number' ? current : 0) + 1;
      localStorage.setItem(VISIT_KEY, JSON.stringify(counts));
    }
  } catch {
    // 열람 횟수를 못 적으면 목록 순서만 기본으로 둡니다.
  }

  if (autoSave instanceof HTMLInputElement) {
    autoSave.checked = localStorage.getItem(AUTOSAVE_KEY) !== '0';
    autoSave.addEventListener('change', () => {
      localStorage.setItem(AUTOSAVE_KEY, autoSave.checked ? '1' : '0');
    });
    window.setInterval(() => {
      if (autoSave.checked) window.dispatchEvent(new CustomEvent(TOOL_SAVE));
    }, 3000);
  }

  async function copyUrl() {
    const url = `${location.origin}${location.pathname}${location.search}`;
    try {
      await navigator.clipboard.writeText(url);
    } catch {
      const area = document.createElement('textarea');
      area.value = url;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.left = '-9999px';
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    }
    note?.classList.remove('hidden');
    window.clearTimeout(timer);
    timer = window.setTimeout(() => note?.classList.add('hidden'), 1600);
  }

  shareButton?.addEventListener('click', () => {
    void copyUrl();
  });
})();</script>
